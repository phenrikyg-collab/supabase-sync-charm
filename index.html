    <style>
      .public-landing {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 3rem 1.5rem;
        font-family: 'DM Sans', sans-serif;
        background-color: #fafaf9;
        color: #1a1a1a;
      }
      html:not(.is-home) .public-landing {
        display: none !important;
      }
      .public-landing__content {
        max-width: 42rem;
        text-align: center;
      }
      .public-landing__title {
        font-family: 'DM Serif Display', serif;
        font-size: clamp(2.25rem, 6vw, 3.75rem);
        font-weight: 600;
        line-height: 1.1;
        margin: 0 0 1.5rem;
      }
      .public-landing__text {
        font-size: clamp(1rem, 2.5vw, 1.125rem);
        line-height: 1.7;
        color: #525252;
        margin: 0 0 2rem;
      }
      .public-landing__button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 2.75rem;
        padding: 0 1.5rem;
        border-radius: 0.5rem;
        font-weight: 500;
        text-decoration: none;
        background-color: #b8860b;
        color: #fff;
      }
      .public-landing__button:hover {
        background-color: #9a7009;
      }
    </style>
    <script>
      (function () {
        if (window.location.pathname === "/") {
          document.documentElement.classList.add("is-home");
